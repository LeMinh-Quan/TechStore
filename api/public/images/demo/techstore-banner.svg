<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Ưu đãi công nghệ tại TechStore</title>
  <desc id="description">Banner dữ liệu mẫu cho cửa hàng TechStore</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123b70"/>
      <stop offset="1" stop-color="#287ec2"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#background)"/>
  <circle cx="1000" cy="180" r="112" fill="#ffffff" opacity=".12"/>
  <circle cx="1000" cy="180" r="72" fill="#ffffff" opacity=".16"/>
  <text x="76" y="150" fill="#ffffff" font-family="Arial, sans-serif" font-size="48" font-weight="700">Ưu đãi công nghệ</text>
  <text x="78" y="215" fill="#e5f3ff" font-family="Arial, sans-serif" font-size="28">Khám phá sản phẩm tại TechStore</text>
</svg>
